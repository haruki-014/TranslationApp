# frontend コンテナの nginx 設定。
# 役割は 2 つ: React のビルド結果（静的ファイル）の配信と、/api の backend への中継。
# 画面と API を同じオリジンにまとめることで、ブラウザの CORS 制限を気にしなくてよくなる。

# Host ヘッダーが下の server_name のどれにも一致しないリクエストは、応答せずに接続を切る（444）。
# DNS リバインディング攻撃への対策:
#   悪意のあるサイトが自分のドメイン名を 127.0.0.1 に向け直すと、ブラウザはそのサイトの一部として
#   このアプリへリクエストを送れてしまう。その場合 Host ヘッダーは攻撃者のドメイン名になるので、
#   localhost / 127.0.0.1 以外の Host を拒否すれば防げる。
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Compose ネットワーク内のサービス名 backend で FastAPI に中継する
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTP/1.1 の keep-alive を backend との間で使えるよう、Connection ヘッダーを空にする
        proxy_set_header Connection "";

        # SSE（ストリーミング翻訳）をバッファせずに流す。
        # nginx は既定で backend の応答を溜めてからまとめて返すため、これを切らないと
        # 訳文が少しずつではなく最後に一度に表示されてしまう。
        proxy_buffering off;
        proxy_cache off;
        # 長文の翻訳で応答が長引いても切断しない（backend 側の読み取りタイムアウトと同じ 600 秒）
        proxy_read_timeout 600s;
        # 原文の最大長（20,000 文字）を日本語の UTF-8 で送っても収まる大きさ
        client_max_body_size 2m;
    }

    # Vite が出力する JS / CSS はファイル名に内容のハッシュが入っている（index-CyZ_2FCu.css など）。
    # 中身が変わればファイル名も変わるので、ブラウザに長期間キャッシュさせても古いものが残らない。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA（シングルページアプリ）用の設定。
    # /chat/xxx のような URL を直接開いたり再読み込みしたりしても、実際のファイルはないので、
    # index.html を返して React Router に画面を決めさせる。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
